# Disposable IMAP fixture for the himalaya-mail-mcp integration tests.
# Replaces the image's /etc/dovecot/dovecot.conf entirely: IMAP only, no
# submission/LMTP/sieve/POP3, so the fixture itself cannot relay mail.
dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3

base_dir = /run/dovecot
state_dir = /run/dovecot
protocols = imap
listen = *
log_path = /dev/stdout

default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail
mail_uid = vmail
mail_gid = vmail

# sdbox, not maildir: maildir with the index layout logged "UIDVALIDITY
# changed" on the first save into auto-created mailboxes.
mail_driver = sdbox
mailbox_list_utf8 = yes
mail_path = ~/mail
mail_home = /srv/vmail/%{user | username | lower}

# Proton Bridge speaks IMAP4rev1 with modified UTF-7 mailbox names, so keep
# UTF8=ACCEPT and IMAP4rev2 off to exercise the same encoding path.
imap4rev2_enable = no
mail_utf8_extensions = no
# No Dovecot-only $HasAttachment/$HasNoAttachment keywords (Bridge adds none).
mail_attachment_detection_options =

# Audit trail on stdout (docker logs): tests assert that reads cause no
# flag_change and that mutations touch only the intended messages.
mail_plugins {
  mail_log = yes
  notify = yes
}
mail_log_events = delete undelete expunge save copy mailbox_create mailbox_delete mailbox_rename flag_change
mail_log_fields = uid box msgid flags

auth_mechanisms = plain login
auth_allow_cleartext = no
ssl = required
ssl_min_protocol = TLSv1.2
ssl_server {
  cert_file = /etc/dovecot/fixture/server.pem
  key_file = /etc/dovecot/fixture/server.key
}

passdb passwd-file {
  passwd_file_path = /etc/dovecot/fixture/users
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/fixture/users
}

namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# 31143: cleartext + STARTTLS (Bridge style). 31993: implicit TLS.
# The image grants chroot via file capabilities; the container runs with
# no-new-privileges and only SYS_CHROOT, so skip the login chroot.
service imap-login {
  process_min_avail = 1
  chroot =
  inet_listener imap {
    port = 31143
  }
  inet_listener imaps {
    port = 31993
    ssl = yes
  }
}

# Written by the harness: the capability profile (bridge, nomove or full).
!include_try /etc/dovecot/fixture/profile.conf
